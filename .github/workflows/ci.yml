name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Postgres only (no auth, storage, studio…): applies migrations and seed.
      - run: pnpm exec supabase db start
      - name: RLS and schema tests (pgTAP)
        run: pnpm db:test
      - name: SQL lint
        run: pnpm db:lint
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/db/types.ts \
            || (echo "::error::src/lib/db/types.ts is stale. Run pnpm db:types and commit it." && exit 1)

  e2e:
    name: Build and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only what the app uses: Postgres, Auth (gotrue), REST (postgrest) and the API gateway (kong).
      - name: Start Supabase (auth stack)
        run: >-
          pnpm exec supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # NEXT_PUBLIC_* values are inlined at build time, so .env.local must exist before the build.
      - run: pnpm env:local
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
