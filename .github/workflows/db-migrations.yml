name: Database migrations

# Staging: migrations from a PR are applied so its Vercel preview has the new schema.
# Production: applied by deploy-production.yml (which calls this workflow) before the new
# code is deployed, only when enabled (repo variable PRODUCTION_DB_ENABLED=true) and after
# manual approval (environment rule). See docs/adr/0013-deploy-production-after-migrations.md.
# Manual runs (workflow_dispatch) pick the target. They bootstrap or recover a database with
# every existing migration (see docs/adr/0010-manual-production-migration-runs.md).
# Connection: direct Postgres connection through the session pooler, no Supabase
# access token (see docs/adr/0002-migrations-via-direct-connection.md).
# Conditions use `inputs.*`, not github.event_name: in a called workflow the event is the
# caller's.
on:
  pull_request:
    # Changes to this workflow are exercised against staging too (no-op without new migrations).
    paths: ["supabase/migrations/**", ".github/workflows/db-migrations.yml"]
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      target:
        description: "Database to migrate"
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: "Only show the migrations that would be applied"
        type: boolean
        default: true

concurrency:
  group: db-migrations-${{ inputs.target == 'production' && 'production' || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Migrate staging
    # Fork PRs have no access to secrets.
    if: >-
      inputs.target == 'staging' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build connection URL
        run: |
          password="$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')"
          echo "::add-mask::$password"
          echo "DB_URL=postgresql://postgres.${PROJECT_REF}:${password}@${POOLER_HOST}:5432/postgres" >> "$GITHUB_ENV"
      - name: Pending migrations (dry run)
        run: pnpm exec supabase db push --db-url "$DB_URL" --dry-run
      - name: Apply migrations
        if: github.event_name == 'pull_request' || inputs.dry_run == false
        run: pnpm exec supabase db push --db-url "$DB_URL"

  production:
    name: Migrate production
    if: vars.PRODUCTION_DB_ENABLED == 'true' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build connection URL
        run: |
          password="$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')"
          echo "::add-mask::$password"
          echo "DB_URL=postgresql://postgres.${PROJECT_REF}:${password}@${POOLER_HOST}:5432/postgres" >> "$GITHUB_ENV"
      - name: Pending migrations (dry run)
        run: pnpm exec supabase db push --db-url "$DB_URL" --dry-run
      - name: Apply migrations
        if: inputs.dry_run == false
        run: pnpm exec supabase db push --db-url "$DB_URL"
