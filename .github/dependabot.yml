version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the Node runtime (.nvmrc). Bump manually when Node is upgraded.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Built on AI SDK v6 (ai 6.x, @ai-sdk/react 3.x). A major upgrade is a
      # planned migration with its own branch, not a Dependabot bump.
      - dependency-name: "ai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ai-sdk/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
